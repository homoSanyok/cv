    <style>
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #f5f5f7;
        color: #6e6e73;
      }

      #page-loader img {
        display: block;
        object-fit: contain;
      }

      .page-loader__spinner {
        position: relative;
        width: 28px;
        height: 28px;
      }

      .page-loader__spinner span {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 3px;
        height: 7px;
        margin-top: -3.5px;
        margin-left: -1.5px;
        border-radius: 2px;
        background: currentColor;
        transform: rotate(calc(var(--segment) * 30deg)) translateY(-10px);
        animation: page-loader-fade 1s linear infinite;
        animation-delay: calc(var(--segment) * 1s / 12 - 1s);
      }

      @keyframes page-loader-fade {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.15;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .page-loader__spinner span {
          animation: none;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="page-loader" role="status" aria-label="Загрузка страницы">
      <img src="/assets/favicon.svg" alt="" width="80" height="80" />
      <div class="page-loader__spinner" aria-hidden="true">
        <span style="--segment: 0"></span>
        <span style="--segment: 1"></span>
        <span style="--segment: 2"></span>
        <span style="--segment: 3"></span>
        <span style="--segment: 4"></span>
        <span style="--segment: 5"></span>
        <span style="--segment: 6"></span>
        <span style="--segment: 7"></span>
        <span style="--segment: 8"></span>
        <span style="--segment: 9"></span>
        <span style="--segment: 10"></span>
        <span style="--segment: 11"></span>
      </div>
    </div>
    <script>
      const removePageLoader = () => {
        document.getElementById("page-loader")?.remove();
      };

      if (document.readyState === "complete") {
        removePageLoader();
      } else {
        window.addEventListener("load", removePageLoader, { once: true });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
